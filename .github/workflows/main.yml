name: Random Day 1 Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-random-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Bring in the code
        uses: actions/checkout@v4

      - name: Print today's date
        run: date

      - name: Check the server's disk space
        run: df -h

      - name: Print a custom multi-line message
        run: |
          echo "This is a completely random pipeline!"
          echo "It is running on a free GitHub Ubuntu server."
          echo "Great job making it this far, Kirtan."
